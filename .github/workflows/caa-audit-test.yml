name: caa audit test (fork only)

on:
  workflow_dispatch:
  push:
    branches: [caa-audit-test]

jobs:
  run-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Mock Slack webhook
        run: |
          cat > /tmp/mocks.py <<'PY'
          import json, sys, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from urllib.parse import urlparse, parse_qs

          class Slack(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("content-length", 0))).decode()
                  open("/tmp/slack.log", "a").write(body + "\n")
                  self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
              def log_message(self, *a): pass

          ANSWERS = {
              "dangling.test.example": {"Status": 3, "Answer": [{"name": "dangling.test.example.", "type": 5, "data": "gone.test.invalid."}]},
              "fine.test.example": {"Status": 0, "Answer": [{"name": "fine.test.example.", "type": 5, "data": "target.test.example."}, {"name": "target.test.example.", "type": 1, "data": "192.0.2.10"}]},
          }

          class Doh(BaseHTTPRequestHandler):
              def do_GET(self):
                  name = parse_qs(urlparse(self.path).query)["name"][0]
                  self.send_response(200); self.send_header("content-type", "application/dns-json"); self.end_headers()
                  self.wfile.write(json.dumps(ANSWERS.get(name, {"Status": 3})).encode())
              def log_message(self, *a): pass

          threading.Thread(target=HTTPServer(("0.0.0.0", 9999), Slack).serve_forever, daemon=True).start()
          HTTPServer(("0.0.0.0", 9998), Doh).serve_forever()
          PY
          : > /tmp/slack.log
          nohup python3 /tmp/mocks.py > /tmp/mocks.log 2>&1 &
          sleep 2

      - name: Start Kestra
        run: |
          curl -sL -o kestra https://github.com/kestra-io/kestra/releases/download/v2.0.6/kestra-2.0.6
          chmod +x kestra
          mkdir -p kdata
          cat > kconf.yml <<'CONF'
          kestra:
            server:
              basic-auth:
                username: admin@kestra.io
                password: Kestra12345
            repository:
              type: h2
            queue:
              type: h2
            storage:
              type: local
              local:
                base-path: /tmp/kstorage
            plugins:
              configurations:
                - type: io.kestra.plugin.scripts.runner.docker.Docker
                  values:
                    volumes: ["/tmp/ca/ca.crt:/ca.crt:ro"]
                    extraHosts: ["caa-mismatch.test:172.17.0.1"]
                - type: io.kestra.plugin.scripts.python.Script
                  values:
                    env:
                      SSL_CERT_FILE: /ca.crt
            tasks:
              scripts:
                docker:
                  volume-enabled: true
          micronaut:
            server:
              port: 8089
          CONF
          export SECRET_SLACK_WEBHOOK_URL=$(printf %s "http://localhost:9999/hook" | base64 -w0)
          nohup ./kestra server local --config kconf.yml > kestra.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u admin@kestra.io:Kestra12345 http://localhost:8089/api/v1/main/flows/search || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "api status: $code"

      - name: Validate the shipped flow
        run: |
          python3 - <<'PY'
          s = open("flows/caa-and-certificate-issuer-audit.yaml").read()
          open("/tmp/shipped.yaml", "w").write(s[: s.index("\nextend:")].replace("namespace: company.team", "namespace: test"))
          PY
          out=$(curl -s -u admin@kestra.io:Kestra12345 -X POST http://localhost:8089/api/v1/main/flows/validate -H 'Content-Type: application/x-yaml' --data-binary @/tmp/shipped.yaml)
          echo "$out"
          echo "$out" | python3 -c "import json,sys; r=json.load(sys.stdin); assert all(not x.get('constraints') for x in r), r"
          curl -s -u admin@kestra.io:Kestra12345 -X POST http://localhost:8089/api/v1/main/flows -H 'Content-Type: application/x-yaml' --data-binary @/tmp/shipped.yaml | head -c 200; echo

      - name: Run the unmodified flow (real Slack task posts to the mock webhook)
        run: |
          run_flow() {
            : > /tmp/slack.log
            E=$(curl -s -u admin@kestra.io:Kestra12345 -X POST http://localhost:8089/api/v1/main/executions/test/caa-and-certificate-issuer-audit "$@" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            echo "execution $E"
            for i in $(seq 1 90); do
              st=$(curl -s -u admin@kestra.io:Kestra12345 http://localhost:8089/api/v1/main/executions/$E | python3 -c "import json,sys; print(json.load(sys.stdin)['state']['current'])")
              case "$st" in SUCCESS|FAILED|WARNING|KILLED|CANCELLED) break;; esac
              sleep 10
            done
            echo "final state: $st"
            test "$st" = "SUCCESS"
            echo "--- Slack payload received:"; cat /tmp/slack.log
          }
          run_flow -F 'domains=["github.com","google.com","example.com"]' -F 'approved_issuers=["Google Trust Services"]'
          cp /tmp/slack.log /tmp/slack-run1.log
          run_flow -F 'domains=["google.com"]' -F 'approved_issuers=["Google Trust Services"]'
          cp /tmp/slack.log /tmp/slack-run2.log
          run_flow -F 'domains=["caa-mismatch.test"]' -F 'resolver_url=http://172.17.0.1:9997/dns-query'
          cp /tmp/slack.log /tmp/slack-mismatch.log

      - name: Assertions
        run: |
          python3 - <<'PY'
          run1 = open("/tmp/slack-run1.log").read()
          run2 = open("/tmp/slack-run2.log").read()
          assert "github.com: issuer" in run1 and "not on the approved list" in run1
          assert "example.com: no CAA record" in run1
          assert "google.com" not in run1
          mism = open("/tmp/slack-mismatch.log").read()
          assert "caa-mismatch.test: served certificate is from Sectigo Test CA, which the CAA policy (letsencrypt.org) does not list" in mism
          assert run2.strip() == "", "google.com has a CAA that allows pki.goog and is on the approved list: no alert expected"
          print("ALL ASSERTIONS PASSED")
          PY

      - name: Kestra log
        if: always()
        run: tail -n 80 kestra.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            /tmp/slack.log
            kestra.log
