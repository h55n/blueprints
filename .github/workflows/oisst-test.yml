name: NOAA OISST real Kestra execution proof (fork only)
on:
  push:
    branches: [test-noaa-oisst-zarr-oct28]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-kestra:
    if: github.repository == 'h55n/blueprints'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime and plugins
        run: |
          set -euo pipefail
          python -m pip install requests PyYAML uv
          mkdir -p /tmp/kestra-runtime /tmp/oisst-blueprint
          curl -fLsS --retry 3 https://github.com/kestra-io/kestra/releases/download/v2.0.7/kestra-2.0.7 -o /tmp/kestra-runtime/kestra
          java -jar /tmp/kestra-runtime/kestra plugins install --locally io.kestra.plugin:plugin-script-python:1.18.4 io.kestra.plugin:plugin-compress:1.6.1 --plugins /tmp/kestra-runtime/plugins
      - name: Run exact flow and reject bad inputs without publishing
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,secrets,yaml
          x={'kestra':{'plugins':{'auto-install':{'enabled':False}},'storage':{'type':'local','local':{'base-path':'/tmp/kestra-runtime/storage'}},'server':{'basic-auth':{'username':'test@example.invalid','password':'Aa9'+secrets.token_hex(16)}}},'micronaut':{'server':{'host':'127.0.0.1','port':18080}}}
          pathlib.Path('/tmp/kestra-runtime/config.yml').write_text(yaml.safe_dump(x))
          PY
          python tests/oisst/matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-kestra-oisst-executions-and-zarr
          path: |
            /tmp/oisst-blueprint/*-execution.json
            /tmp/oisst-blueprint/*-logs.json
            /tmp/oisst-blueprint/runtime-verified.zip
            /tmp/oisst-blueprint/runtime.log
