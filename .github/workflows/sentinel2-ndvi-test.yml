name: Sentinel-2 real Kestra NDVI execution proof (fork only)
on:
  push:
    branches: [test-sentinel2-ndvi-oct27]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-kestra:
    if: github.repository == 'h55n/blueprints'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime and plugins
        run: |
          set -euo pipefail
          python -m pip install requests PyYAML uv
          mkdir -p /tmp/kestra-runtime /tmp/stac-blueprint
          curl -fLsS --retry 3 https://github.com/kestra-io/kestra/releases/download/v2.0.7/kestra-2.0.7 -o /tmp/kestra-runtime/kestra
          chmod +x /tmp/kestra-runtime/kestra
          cd /tmp/kestra-runtime
          ./kestra plugins install --locally io.kestra.plugin:plugin-script-python:1.18.4 io.kestra.plugin:plugin-compress:1.6.1 --plugins /tmp/kestra-runtime/plugins
      - name: Run exact flow against real STAC and COG assets, verify downloaded ZIP
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,secrets,yaml
          x={'kestra':{'plugins':{'auto-install':{'enabled':False}},'storage':{'type':'local','local':{'base-path':'/tmp/kestra-runtime/storage'}},'server':{'basic-auth':{'username':'test@example.invalid','password':'Aa9'+secrets.token_hex(16)}}},'micronaut':{'server':{'host':'127.0.0.1','port':18080}}}
          pathlib.Path('/tmp/kestra-runtime/config.yml').write_text(yaml.safe_dump(x))
          PY
          /tmp/kestra-runtime/kestra server local --config /tmp/kestra-runtime/config.yml --plugins /tmp/kestra-runtime/plugins --no-tutorials --worker-thread 4 > /tmp/stac-blueprint/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          python tests/sentinel2/matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-kestra-executions-and-raster
          path: |
            /tmp/stac-blueprint/*-execution.json
            /tmp/stac-blueprint/*-logs.json
            /tmp/stac-blueprint/matrix-results.json
            /tmp/stac-blueprint/verified.zip
            /tmp/stac-blueprint/server.log
